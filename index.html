<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>動物醫事助理｜100題隨機模擬考</title><style>
:root{font-family:system-ui,"Microsoft JhengHei",sans-serif;color:#18283b;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}.wrap{max-width:980px;margin:auto;padding:22px 15px 70px}header{background:#12334f;color:white;padding:24px;border-radius:20px;margin-bottom:18px}h1{font-size:clamp(23px,4vw,34px);margin:0 0 8px}h2{margin:0 0 16px;font-size:21px}.sub{color:#cbd9e7;font-size:14px}.panel{background:white;border:1px solid #e1e7ed;border-radius:18px;padding:23px;margin-bottom:15px;box-shadow:0 3px 12px #142f4a09}.controls{display:flex;gap:9px;flex-wrap:wrap;align-items:center}button{font:inherit;cursor:pointer;border:0;border-radius:11px;padding:12px 18px;background:#116ba4;color:white;font-weight:650}button:hover{filter:brightness(.95)}button.secondary{background:#e7eef4;color:#1d4059}button:disabled{opacity:.4;cursor:default}.muted{color:#637486;font-size:14px}.progress{height:10px;background:#e5edf3;border-radius:99px;overflow:hidden;margin:16px 0}.fill{height:100%;background:#1592ae;transition:width .2s}.choices{display:grid;gap:10px;margin-top:18px}.choice{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;background:#f8fafc;border:1.5px solid #d9e2eb;color:#233d54;font-weight:450;padding:15px;border-radius:12px;line-height:1.6}.choice.sel{background:#e5f4fc;border-color:#1181bb}.letter{font-weight:750;min-width:24px;color:#1677a6}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}.stat{background:#f1f6fa;padding:15px;border-radius:12px;text-align:center}.stat strong{display:block;font-size:28px}.review{border-top:1px solid #e3e9ee;padding:18px 0;line-height:1.7}.good{color:#168264}.bad{color:#c34444}.tag{font-size:12px;color:#5d7080}.bar{height:12px;background:#e8eef4;border-radius:20px;overflow:hidden;margin:8px 0}.bar span{display:block;height:100%;background:#168f85}.flow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}.node{padding:7px 11px;border-radius:9px;background:#edf3f8;font-size:13px}.node.right{background:#dcf5e9;color:#116746}.node.wrong{background:#fce8e8;color:#a83434}.nav{display:flex;gap:8px;justify-content:space-between;margin-top:20px}.hide{display:none!important}label{cursor:pointer}.gridnums{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:7px;margin-top:16px}.num{padding:9px 0;background:#e8eef4;color:#355069;font-size:13px}.num.done{background:#cdebe9;color:#166e68}.num.current{outline:2px solid #197cad}#chart{width:180px;height:180px} .summary{display:flex;gap:28px;align-items:center;flex-wrap:wrap}.foot{font-size:13px;color:#68798a;margin-top:12px}@media(max-width:550px){.panel{padding:16px}.stats{gap:6px}.stat{padding:10px}.stat strong{font-size:22px}.wrap{padding:10px 10px 60px}}</style></head><body><div class="wrap"><header><h1>動物醫事助理｜隨機 100 題模擬考</h1><div class="sub">依據《考古題1.pdf》題庫｜每次重新抽題｜作答後提供分數、統計圖與逐題圖解對照</div></header>
<section id="intro" class="panel"><h2>開始測驗</h2><p>從題庫中隨機抽取 100 題，四選一作答。可自由前後切換，最後交卷才公布答案與成績。</p><div class="controls"><button onclick="start()">開始隨機 100 題</button><span class="muted" id="bank"></span></div><p class="foot">答案以原始考古題為準；部分原始題目可能有錯字或爭議，並未額外查證。圖解提供作答與標準答案的視覺對照，不代表額外醫學驗證。</p></section>
<section id="exam" class="hide"><div class="panel"><div class="controls" style="justify-content:space-between"><strong id="counter"></strong><span class="muted" id="answered"></span></div><div class="progress"><div class="fill" id="fill"></div></div><div class="tag" id="source"></div><h2 id="question" style="margin-top:12px;line-height:1.65"></h2><div id="choices" class="choices"></div><div class="nav"><button class="secondary" onclick="move(-1)">上一題</button><button class="secondary" onclick="move(1)">下一題</button></div><div class="gridnums" id="numbers"></div></div><div class="panel controls"><button onclick="submitExam()">交卷並計算成績</button><button class="secondary" onclick="resetExam()">重新抽題</button></div></section>
<section id="result" class="hide"><div class="panel"><h2>測驗結果與成績圖解</h2><div class="summary"><svg id="chart" viewBox="0 0 120 120" role="img" aria-label="答對率圓環圖"><circle cx="60" cy="60" r="47" fill="none" stroke="#e9eef4" stroke-width="14"/><circle id="ring" cx="60" cy="60" r="47" fill="none" stroke="#168f85" stroke-width="14" stroke-linecap="round" transform="rotate(-90 60 60)"/><text id="pct" x="60" y="66" text-anchor="middle" font-size="24" font-weight="bold" fill="#18354d"></text></svg><div style="flex:1;min-width:230px"><div class="stats"><div class="stat"><strong id="score"></strong><small>得分 / 100</small></div><div class="stat"><strong class="good" id="correct"></strong><small>答對</small></div><div class="stat"><strong class="bad" id="incorrect"></strong><small>答錯／未答</small></div></div><div>正確率<div class="bar"><span id="accuracy"></span></div></div></div></div><div class="controls"><button onclick="resetExam()">再考一次（重新抽題）</button><button class="secondary" onclick="toggleWrong()" id="wrongBtn">只看錯題</button><button class="secondary" onclick="window.print()">列印成績</button></div></div><div class="panel"><h2>逐題檢討與答案圖解</h2><p class="muted">每題顯示「你的作答 → 題庫標準答案」，並保留全部選項。題庫未附詳解，因此不會捏造醫學解釋。</p><div id="reviews"></div></div></section></div>
<script>const BANK=[{"id":1,"q":"＿＿＿反應了藥袋標示、藥品分裝、以及核對藥品數量所費時間的成本？","o":["加成費(Markup)","架儲費(shelflife)","基本處方費(minimum prescription fee)","調劑費(dispensing fee)"],"a":"D"},{"id":2,"q":"＿＿＿是一種防水、可熱封的防塵罩","o":["滅菌前包裝(presterilization wrap)","滅菌後包裝(poststerilization wrap)","布巾包裝(drape wrap)","滅菌袋(sterilization pouch)"],"a":"B"},{"id":3,"q":"＿＿＿前面被擋住＿＿＿該如何與病患互動？","o":["只需完成工作，不需互動","提供友好的服務和支持","避免與病患交流","只在必要時與病患溝通"],"a":"B"},{"id":4,"q":"「天然」一詞在寵物食品中指的是什麼？","o":["含有防腐劑的食品","含有化學添加劑","經過高溫處理的食品","未添加任何合成或人工成分"],"a":"D"},{"id":5,"q":"「有機」一詞在寵物食品中代表什麼？","o":["只使用冷凍成分","所有成分都來自植物","不含任何添加劑","用於生長作物或飼養牲畜的方法"],"a":"D"},{"id":6,"q":"「我覺得她有某種感染，因為她一直在抓癢」，飼主這樣告訴動物醫事助理。飼主接著說：他一直有皮脂漏的問題，而且我注意到她最近更常 在地毯上拖著屁走。請問以下所列的行為，何者是最為適當的？","o":["動物醫事助理在病患的病史記錄皮脂漏","動物醫事助將病患的診斷記為肛門腺阻塞","動物醫事助提出問題詢問以確定飼主是否了解皮脂漏的意思","將主訴記錄為皮脂"],"a":"C"},{"id":7,"q":"「哦，她是個小壞蛋！」飼主有點小抱怨地跟動物醫事助理說她的紅貴賓，「我回家看到家裡地上一堆咬爛的衛生紙就罵了她，結果你知道 嗎？她看了我一眼，就在廚房尿尿生我的氣！」。請問飼主這樣解讀大的行為，我們將之稱為稱為？","o":["社會化","擬人化","減敏作用","反制約作用"],"a":"B"},{"id":8,"q":"「轉介」的目的為何？","o":["推卸責任","增加營收","協助動物接受更專業治療","避免醫療糾紛"],"a":"C"},{"id":9,"q":"○○動物醫院 A 藥的平均需求量為 40(顆/天)，安全存量設定為 400 顆，採購前置時間為 3 天，若採再訂購點(re-order Point)之藥品訂購策略， 請問 A 藥的再訂購點應設定在多少顆？","o":["400","520","640","720"],"a":"B"},{"id":10,"q":"○○動物醫院在候診區貨架固定放著 4 瓶精品燕麥洗毛精販售，每瓶售價新台幣 600 元，去年該產品售出新台幣 24000 元，請問洗毛精的庫 存周轉率為？","o":["40","100","10","20"],"a":"C"},{"id":11,"q":"100 磅(lb)的狗，換算成公制，請問是幾公斤(kg)？","o":["220","100","45.5","45.4"],"a":"D"},{"id":12,"q":"13 歲的貓，慢性腎病 3 期，出現明顯的腎性蛋白尿，BCS3/9。該貓同時患有糖尿病，通過胰島素調節，仍高於正常值，以下哪種飲食方案 是目前比較適合該患貓的推薦？","o":["成貓糖尿病處方糧","成貓腎臟處方糧","先使用腎臟處方糧病情穩定後，更換糖尿病處方糧調節血糖","先使用糖尿病處方糧幫助調節血糖，後更換腎臟處方糧"],"a":"B"},{"id":13,"q":"1 公斤(kg)比 1 公克(g)","o":["大 10000 倍","大 100 倍","大 10 倍","大 1000 倍"],"a":"D"},{"id":14,"q":"2 歲已絕育公犬，慢性嘔吐伴有皮膚發紅搔癢，醫生懷疑存在食物過敏，準備進行排查，以下描述正確的是？","o":["可以送檢進行過敏原篩查，排除結果中所有導致過敏的食物","主人選擇了一款網紅無穀糧作為低敏飲食，可用於食物排除試驗","低過敏處方糧使用大豆水解蛋白，降低蛋白分子量，減少致敏","餵食羽毛水解蛋白配方，進行至少 8 周的食物排除試驗，並嚴格禁止狗狗吃到其他食物"],"a":"D"},{"id":15,"q":"2 歲貓就診，發現已嘔吐腹瀉 10 天，精神狀況正常，食慾佳。主人希望先不做過多檢查，此時","o":["首選腸道處方飼料","首選低過敏處方飼料","首選康復期濕糧","首選高纖易消化處方飼料"],"a":"A"},{"id":16,"q":"3kg 的貓(假定維持量 180ml/天)、10%脫水，預計在 24 小時補完脫水，預計輸液量為何？","o":["5ml/hr","10ml/hr","20ml/hr","30ml/hr"],"a":"C"},{"id":17,"q":"3 歲巴哥，體重 10kg，BCS(體態評分)8/9，以下對其飲食建議不合理的是？","o":["其理想體重為 7kg，建議該犬減重","需要低能量密度的飲食","飲食中需要較高的蛋白含量","飲食中無需碳水化合物，可避免體重升高"],"a":"D"},{"id":18,"q":"3 歲患犬，慢性嘔吐，每週 2-3 次，持續三個月以上，胃鏡檢查發現了大量螺旋桿菌，確診為細菌性胃炎，暫無其他疾病症狀提示，可推薦 的食物是？","o":["犬腸胃低脂處方糧","犬腸胃道處方糧","犬低過敏性處方糧","犬腸胃道高纖處方糧"],"a":"B"},{"id":19,"q":"3 歲患貓，BCS3，慢性腹瀉 2 年有餘，嘗試多種治療手段均無好轉。試用貓胃腸道處方飼料，使用 1 月後症狀依舊，此時：","o":["建議使用低過敏處方飼料","建議繼續使用胃腸道處方飼料","建議使用康復期處方濕糧","建議使用成貓配方飼料"],"a":"A"},{"id":20,"q":"3 歲患貓就診，主訴家裡新養了一隻貓，患貓出現緊迫反應，食慾稍有下降，頻繁去貓砂盆，排尿時發出叫聲，膀胱穿刺採尿進行尿檢沒有 發現細菌，但發現了少量鳥糞石結晶，經診斷為非阻塞性 FIC(特發性膀胱炎)，以下對該患貓的飼養管理不合適的是","o":["幫助患貓增加日常飲水","緩解緊迫因素，可以使用費洛蒙作為輔助","停止餵食乾糧，長期餵食零食罐頭或水煮雞肉","只需更換為情緒舒緩處方糧"],"a":"C"},{"id":21,"q":"3 歲絕育母犬，疫苗完整，無驅蟲史，餵食商品化寵物糧，無換糧史，但不限零食。持續性軟便一個月左右，有時一天會拉 3-4 次，平日啃 咬、舔舐、抓撓頻率和時長均有所增加，以下哪種食物可作為優先推薦進行嘗試？","o":["成犬腸胃道處方糧","成犬腸胃道低脂處方糧","成犬皮膚處方糧","成犬皮膚低過敏處方糧"],"a":"D"},{"id":22,"q":"4 歲已絕育公貓，搬家後出現排尿問題，醫生診斷為自發性膀胱炎，尿檢中發現草酸鈣結晶。以下關於該貓營養管理的描述錯誤的是？","o":["需要針對該貓壓力問題舒緩情緒","需要幫助患貓增加飲水，可以建議使用濕糧","成貓泌尿道處方糧可以酸化尿液導致草酸鈣結晶增加，不推薦使用","建議推薦成貓泌尿道+舒緩緊張專用配方"],"a":"C"},{"id":23,"q":"4 歲患犬，症狀為油膩樣腹瀉(脂肪痢)，噁心，但食欲旺盛，醫生診斷為胰外分泌不足(EPI)，未出現繼發慢性胰腺炎，以下對該患犬飲食的 推薦要點錯誤的是？","o":["餵食低脂肪食物","易消化、高能量密度食物","高纖維食物","飲食需要配合添加額外的胰酶"],"a":"C"},{"id":24,"q":"5 歲黃金獵犬，先天性髖關節發育不良，已經出現跛行，主人拒絕手術決定採用保守治療，醫生推薦該換將飲食更換為犬關節處方糧，可以 為患犬帶來的好處不包含以下哪點？","o":["補充大量的鈣","避免能量攝入過多，控制體重，減少關節負擔","添加 omega-3 脂肪酸有助於抗發炎","添加硫酸軟骨素、氨基葡萄糖有助於保護關節軟骨"],"a":"A"},{"id":25,"q":"5 歲雌性美短，8kg，主訴隔壁近一周裝修聲音較大，貓咪食慾下降，基本不吃東西，就診時已出現黃疸，醫生診斷為肝脂肪沉積，對該患 貓的治療下列推薦錯誤的是？","o":["儘快恢復飲食","建議使用成貓肝臟處方糧","建議使用犬貓康復期處方濕糧","必要時可使用管飼"],"a":"B"},{"id":26,"q":"6 歲美國短毛家貓，已絕育，體重 7kg，體況評分 8 分，非常可愛粘人。主人帶到醫院體檢，發現血糖比較高，醫生診斷為糖尿病，建議飼 主進行藥物加飲食管理。對於這個病例你的營養管理方案是什麼？","o":["吃皇家糖尿病處方飼料就對了","貓糖尿病大部分和肥胖相關，這只貓已經處於肥胖，需要先使用體重控制處方飼料","醫生建議經常核查血糖曲線：先使用糖尿病處方飼料，再根據貓的情況更換成體重控制處方飼料","配合胰島素做貓糖尿病飼料的血糖曲線，等血糖控制穩定直接換成相同熱量的體重控制處方飼料"],"a":"C"},{"id":27,"q":"6 歲鬥牛犬，體態評分 8/9，走路都喘，主人經常嘗試減肥但是無法抗拒牠渴望食物的眼神。減肥是一個艱難的過程，除了適度增加運動 量，還要嚴格控制食物攝入。為了減少動物的饑餓感，皇家減肥處方糧如何控制動物乞食？","o":["大量脂肪延緩胃排空","增加碳水化合物不讓動物感到饑餓","減少纖維含量，提高飽腹感","增加顆粒體積"],"a":"D"},{"id":28,"q":"6 歲患犬長期大腸性下痢，糞便呈糊狀，有粘液，血便，裡急後重，嘗試胃腸道處方飼料後症狀仍然持續，此時可以首選嘗試","o":["犬低過敏處方飼料","犬高纖易消化處方飼料","犬低脂易消化處方飼料","犬胃腸道處方濕糧"],"a":"B"},{"id":29,"q":"7 歲患貓，主訴最近排便減少，2-3 天排便一次，糞便較硬，評分約 5/9 分，影像學檢查，腸腔內有大量糞便，但未出現巨結腸。去年也偶爾 發生便秘，通過浣腸緩解。此次浣腸後，為了防止復發，可以為其推薦的飲食為？","o":["成貓腸胃道處方糧","成貓腸胃道處方濕糧","成貓腸胃道低卡路里處方糧","成貓腸胃道高纖處方糧"],"a":"D"},{"id":30,"q":"7 歲暹羅貓，雌性已絕育，BCS9/9。飼主觀察存在嘔吐腹瀉症狀，就診確診為胰腺炎。經治療後，病情穩定，無任何臨床症狀，但血脂爆 表。目前需要選擇下階段營養管理方案，首選推薦的飲食為？","o":["貓過敏控制處方飼料","貓體重控制處方飼料","貓腸胃道處方飼料","貓腸胃高纖易消化處方飼料"],"a":"B"},{"id":31,"q":"9 歲查理斯王小獵犬，患有黏液性的二尖瓣膜疾病，已發展為 C 期，複查腎臟功能時發現肌酐 SDMA 均有升高，無蛋白尿，醫生判斷繼發 慢性腎病，發展至 2 期，以下最適合該患犬的糧食推薦為？","o":["成犬早期腎病處方糧","成犬腎病處方糧","成犬腎臟處方濕糧","成犬心臟病處方濕糧"],"a":"D"},{"id":32,"q":"Acepromazine maleate 屬於？","o":["鴉片類(opioid)","巴比妥酸鹽類(Barbiturates)","phenothiazine 類鎮靜劑","benzodiazepine 類鎮靜劑"],"a":"C"},{"id":33,"q":"ACE 抑制劑(ACE Inhibitors)的主要副作用是什麼？","o":["心律過快","低血壓和高血鉀","呼吸困難","脫水和耳毒性"],"a":"B"},{"id":34,"q":"ACTH 刺激試驗，一般來說用以診斷何者疾病？","o":["庫興氏症/艾迪森氏症","甲狀腺功能亢進","甲狀腺功能低下","糖尿病"],"a":"A"},{"id":35,"q":"Amoxicillin 在犬的劑量為 30mg/kg/day，分為一天兩次給予，而此藥的口服懸浮液，濃度為 125mg/5mL，那麼 20kg 的患犬，每次需服用 mL？","o":["9","12","18","24"],"a":"B"},{"id":36,"q":"Amoxicillin 的描述何者正確？","o":["藥品通用名","品牌藥名","發明者姓名","以上皆非"],"a":"A"},{"id":37,"q":"Amoxicillin 與 ampicillin 都是 am 為首的藥物，描述何者正確？","o":["相同成份","不同成分","可能相同也可能不同","以上皆非"],"a":"B"},{"id":38,"q":"A 經營一動物醫院，某日 B 帶著愛貓 C 至動物醫院就診，A 向 B 表示 C 需留院觀察 3 天，然 3 天後 B 未出現，B 亦未接電話，至第 9 日 時，B 終於接了 A 的電話，A 表示如 B 今天再不來帶貓回去，將依動物保護法向動物保護主管機關檢舉 B 棄養 C，B 聽了之後心生恐懼，於是在當天 下午將 C 接回去並付清所有款項，請針對上述情境，選出適當的答案。","o":["A 無法向動物保護主管機關依動物保護法第 5 條第 3 項規定，檢舉這 6 天 B 棄養 C。","A 可向動物保護主管機關檢舉 B 未提供 C 適當醫療。","B 可向管理獸醫單位主管機關，依獸醫師法第 11 條規定檢舉 A 這 6 天拒絕替 C 醫療。","B 可向動物保護主管機關檢舉 A，未依動物保護法第 22 條第 1 項後段規定，取得貓隻寄養營業執照，經營貓隻寄養。"],"a":"A"},{"id":39,"q":"Bradycardia 這個專有名詞，指的是心率異常變慢，請問下列何者是 bradycardia 的相反詞？","o":["Supracardia","Tachycardia","Megacardia","Hypercard 體的尾端有關。","與身體或結構的中心區域有關。","四肢或身體部位朝向身體的中線或中間移動。","表示位置較遠的部位。"],"a":"B"},{"id":433,"q":"什麼是外展(abduction)的定義？","o":["四肢或身體部位朝向身體的中線或中間移動。","位於身體的中心區域。","四肢或身體部位遠離身體的中線或中間移動。","與身體的尾端有關。"],"a":"C"},{"id":434,"q":"什麼是伸展(extension)的定義？","o":["指某個關節的動作，增大關節的角度","指某個關節的動作，使該部位變得更彎曲","表示位置較遠的部位","與身體的尾端有關"],"a":"A"},{"id":435,"q":"什麼是周邊(peripheral)的定義？","o":["表示位置較遠的部位。","與身體的中心區域有關。","四肢或身體部位朝向身體的中線或中間移動。","指某個關節的動作。"],"a":"A"},{"id":436,"q":"什麼是臥位(recumbent)的定義？","o":["指需要與某個姿勢相關的動作。","與身體的尾端有關。","指某個關節的動作。","指肢體朝向腹側，腹側朝下。"],"a":"A"},{"id":437,"q":"什麼是近端(proximal)的定義？","o":["離身體的中心較遠。","表示位置較遠的部位。","與四足動物的腹部區域有關。","離身體的中心較近。"],"a":"D"},{"id":438,"q":"什麼是後掌面(plantar)的定義？","o":["表示離身體或某個切面較近的位置。","指某個關節的動作。","表示後肢或後肢的底部。","與身體的中心區域有關。"],"a":"C"},{"id":439,"q":"什麼是俯臥(prone)的定義？","o":["指肢體朝向腹側，腹側朝下。","與身體的尾端有關。","指肢體朝向背側，背側朝上。","表示位置較遠的部位。"],"a":"A"},{"id":440,"q":"什麼是深層(deep)的定義？","o":["遠離皮膚表面的表層。","表示位置較遠的部位。","與身體的尾端有關。","靠近皮膚表面的表層。"],"a":"A"},{"id":441,"q":"什麼是深層(deep)與淺層(superficial)的區別？","o":["深層是指肢體朝向腹側，腹側朝下，而淺層是指肢體朝向背側，背側朝上。","深層是遠離皮膚表面的表層，而淺層是靠近皮膚表面的表層。","深層與身體的尾端有關，而淺層與四足動物的背部最接近。","深層是靠近皮膚表面的表層，而淺層是遠離皮膚表面的表層。"],"a":"B"},{"id":442,"q":"什麼是腹側(ventral)的定義？","o":["與身體的尾端有關。","離身體的中心較近。","與四足動物的腹部區域有關。","表示位置較遠的部位。"],"a":"C"},{"id":443,"q":"在解剖學中，什是前掌面(palmar)？","o":["指肢體朝向背側，背側朝上。","表示前肢或前肢的前面。","與身體的尾端有關。","與四足動物的腹部區域有關。"],"a":"B"},{"id":444,"q":"在解剖學中，什麼是中線(medianplane)？","o":["將身體分成左右兩側的平面。","指某個關節的動作。","與身體的尾端有關。","表示位置較遠的部位。"],"a":"A"},{"id":445,"q":"在解剖學中，什麼是內收(adduction)？","o":["表示位置較遠的部位。","四肢或身體部位朝向身體的中線或中間移動。","四肢或身體部位遠離身體的中線或中間移動。","與四足動物的背部最接近。"],"a":"B"},{"id":446,"q":"在解剖學中，什麼是外側(lateral)？","o":["表示離身體或某個切面較近的位置。","表示離身體或某個切面較遠的位置。","指某個關節的動作。","與四足動物的腹部區域有關。"],"a":"B"},{"id":447,"q":"在解剖學中，什麼是尾端(caudal)？","o":["與身體的頭部區域有關。","表示離身體或某個切面較遠的位置。","指某個關節的動作。","與身體的尾端有關。"],"a":"D"},{"id":448,"q":"在解剖學中，什麼是前掌面(palmar)？","o":["指肢體朝向背側，背側朝上。","表示前肢或前肢的前面","與身體的尾端有關。","與四足動物的腹部區域有關。"],"a":"B"},{"id":449,"q":"在解剖學中，什麼是背側(dorsal)？","o":["與身體的尾端有關。","表示離身體或某個切面較近的位置。 ，所以原料昂貴。不 過凍乾含水量極低，餵食不當可能會導致寵物便秘","低溫烘焙糧是採用 80-100 度低溫烘焙緩慢熟化，工藝尚不成熟，經常會出現碎渣。如有澱粉可能導致澱粉糊化不良，引發腹瀉。","風乾糧是在 70 度的低溫狀態下高風速乾燥脫水，類似牛肉乾，非常硬，適口性較差。多數用於零食。"],"a":"B"},{"id":678,"q":"布偶貓需要預防心臟病與關節炎，飲食中最好包含哪些元素？","o":["高度易消化蛋白","額外增加牛磺酸","omega-3&omega-6 脂肪酸","以上皆是"],"a":"D"},{"id":679,"q":"幼犬通常增加體重為成犬後的預計體重的多少？","o":["0.2-0.4g/Kg","2-4g/Kg","20-40g/Kg","200-400g/Kg"],"a":"B"},{"id":680,"q":"幼年動物的骨癒合速度比成年動物：","o":["快","慢","無差別","無法比較"],"a":"A"},{"id":681,"q":"幼駒運動時應避免的動作為何？","o":["直線行走","後退或後仰倒","小跑步","轉彎動作"],"a":"B"},{"id":682,"q":"必須胺基酸的例子是什麼？","o":["碳水化合物","脂肪","水","組氨酸"],"a":"D"},{"id":683,"q":"必須胺基酸的定義是什麼？","o":["不需要的胺基酸","動物必須從食物中獲取的胺基酸","只在特定情況下需要的胺基酸","動物可以自己合成的胺基酸"],"a":"B"},{"id":684,"q":"必需胺基酸指動物不能合成或合成速度遠不能適應身體需要，而必須由食物供給的胺基酸。犬的必需胺基酸有()種，貓的必需胺基酸有()種","o":["8，9","9，10","10，10","10，11"],"a":"D"},{"id":685,"q":"打理毛髮是貓咪的天性，可以幫助牠躲避天敵，隱藏線索。然而貓咪的舌頭上有倒刺，會將脫落毛髮的三分之二吃進肚子中，日積月累， 引發毛球堵塞問題。預防毛球的日常護理中不妥的一項是？","o":["幫助貓咪多梳毛","給貓咪吃高纖維含量的食物，如：含洋車前子等纖維成分的去毛球配方等","讓貓咪生活空間豐富起來，改善無聊的生活狀態也可減少舔毛","每週洗一次澡，保持貓咪乾淨，減少舔毛"],"a":"D"},{"id":686,"q":"未辦理動物用藥品販賣業登記而販賣動物用藥品最低可處新臺幣多少萬元罰鍰？","o":["五萬元","九萬元","四十五萬元","兩百萬元"],"a":"B"},{"id":687,"q":"正常犬貓產尿量約為多少？","o":["0.1-0.2ml/kg/hr","0.3-0.6ml/kg/hr","1-2ml/kg/hr","10-20ml/kg/hr"],"a":"C"},{"id":688,"q":"正常的血漿會呈現什麼顏色？","o":["混濁白色","透明無色至淺稻草黃色","透明紅色","透明黃色"],"a":"B"},{"id":689,"q":"正確鎮咳藥(Antitussive drugs)的使用時機為何？","o":["治療氣管支氣管炎","治療犬舍咳","乾咳引起作嘔或乾嘔類型的反射對上呼吸道的刺激","以上皆是"],"a":"D"},{"id":690,"q":"母兔什麼時候結紮比較適合呢？","o":["3 個月","2 歲內","3 歲之後","不用結紮也沒關係"],"a":"B"},{"id":691,"q":"母馬何時產生絨毛膜促性腺激素？","o":["懷孕母馬","發情母馬","哺乳母馬","以上皆是"],"a":"A"},{"id":692,"q":"母鳥的生殖道僅有哪一側發育","o":["左側","右側","都不發育","都發育"],"a":"A"},{"id":693,"q":"母貂發情如果出現症狀，一般會建議如何處理？","o":["不用處理，讓他自己退情就好","要處理，要幫她刺激會陰部，幫助退情","要盡快就醫請獸醫師檢查，並評估施打藥物退情，以免出現生殖道感染或是貧血等問題","要處理，想辦法用其他事物轉移其注意力"],"a":"C"},{"id":694,"q":"母龜若產蛋困難，初步可以先做什麼？","o":["回家靜養","給予 100mg/kg 葡萄糖鈣","手術","泡水"],"a":"B"},{"id":695,"q":"永續性在寵物食品工業中的意義是什麼？","o":["減少環境衝擊","增加產品的銷售量","提高產品的價格","擴大市場佔有率"],"a":"A"},{"id":696,"q":"生物製劑，特別是疫苗，應該如何儲存？ 聚丙烯(Polypropylene)","手術腸線(Surgical gut)"],"a":"B"},{"id":941,"q":"有一詞主，家裡有兩隻大，年長的拉布拉多 Kuro 通常是老大，牠喜歡躺在客廳的沙發上。如果另一隻年輕的黃金獵犬 Ruby 躺在那個位 置，當 Kuro 經過時，就必須讓位。請問這種行為是什麼的結果？","o":["銘印","經典制約","習慣化","階級"],"a":"D"},{"id":942,"q":"有一種 1mL 的結核菌素注射器，附有 5/8 英吋的 25G 針頭，請問針頭有多長？","o":["1cm²","1mL","5/8 英吋","25G"],"a":"C"},{"id":943,"q":"有一種營養素可以促進脂肪轉運，幫助脂肪燃燒，這種營養素是？","o":["牛磺酸","葡萄糖胺","左旋肉鹼(L-carnitine)","銅離子"],"a":"C"},{"id":944,"q":"有一種營養添加劑，4kg 重的貓，每次可添加 2.5g 於食物內，請問 10kg 重的貓，每次應添加 g 於食物內？","o":["6.25","6.875","12.5","25"],"a":"A"},{"id":945,"q":"有一種營養補充劑，其建議劑量為 10mg/kg，且該補充劑含量(濃度)為 10mg/mL，若患犬體重 30kg，請問應該給予 mL 的補充劑？","o":["1","10","30","300"],"a":"C"},{"id":946,"q":"有一種驅蟲藥，其劑型是 50mg/mL，幼犬的劑量為 10mg/kg，若有一隻幼犬，體重 1.25 公斤，請問該犬需服用＿＿＿mL？","o":["0.25","4","12.5","25"],"a":"A"},{"id":947,"q":"有位飼主來電詢問是否可以讓他的愛犬不繫牽繩來院就診，因為該犬只要戴上項圈就會一直哀鳴(飼主覺得很可憐)，假設接電話的動物醫 事助理覺得這樣做好像也可以，但又不確定，請問他(她)應該如何做？","o":["請飼主稍後再來電","請飼主不要掛斷，先詢問獸醫師，再給答覆","相信自己的直覺，告訴飼主不用戴項圈，該犬一樣可以帶來就診","告知飼主，來院就診的犬。大多數都是繫著牽繩而來，所以最安全的做法是帶著愛犬就診時，一併也把項圈和牽繩帶過來"],"a":"B"},{"id":948,"q":"有位飼主來電說他的黃金獵犬一直在地板磨耳朵，而且一到外面就在草地上打滾。這些症狀，飼主認為與上次該犬耳朵感染時的症狀相 同，飼主想知道他是不是可以用上次剩下來的藥治療。您與這位飼主熟識，也知道該犬過往的病史，請問這時該如何做，才是對飼主最好的幫助？","o":["安排預約，請獸醫師診治","安排預約，並告知就診前可先用上次藥物緩解","請他稍候，並向獸醫師確認再回電","告知可用藥物治療"],"a":"A"},{"id":949,"q":"有個男孩對他即將融世的愛犬(呼名：寶貝)做出承諾，如果寶貝能夠好起來，他會按照寶貝最喜歡的方式，每天晚餐都加罐頭肉給寶貝 吃，請問這個男孩正在經歷喪慟(grief)的的那一個階段？","o":["否認(Denial)","討價還價(Bargaining)","內疚(Guilt)","悲傷(Sorrow)"],"a":"B"},{"id":950,"q":"有哪些疾病，必須謹慎使用利尿劑？","o":["低血壓、低血容量","發高燒","昏迷","細菌感染"],"a":"A"},{"id":951,"q":"有效的獸醫處方必須具備什麼？","o":["藥物的品牌","藥物的顏色","動物的年齡","獸醫的簽名"],"a":"D"},{"id":952,"q":"有機食品的定義是什麼？","o":["使用特定方法生產的食品","只使用植物成分的食品","只使用動物成分的食品","不含任何成分的食品"],"a":"A"},{"id":953,"q":"有關牛的尾根操作保定技術，下列何者錯誤？","o":["人工授精時，應保持牛隻心情平靜，即使牛隻躁動不安，也不應使用尾根保定技術","在經常處理被尾根操作保定的牛隻，牠的服從度會比較高","可使用尾根操作保定，壓迫牛隻進入頸夾","正確操作尾根保定，可讓左右移動的牛靜止下來"],"a":"A"},{"id":954,"q":"有關牛的尾根操作保定技術，下列何者錯誤？","o":["站在牛的正後方，一隻手抬起尾巴，另一隻手抓住尾巴根部","牛的脾氣固執，即使經常對他進行尾根操作保定，他也不會變得服從度會比較高","可使用尾根操作保定，壓迫牛隻進入頸夾","操作尾根保定可以是一種極好的保定方法，一個人就可以進行"],"a":"B"},{"id":955,"q":"有關牛的尾根操作保定技術，下列何者錯誤？","o":["站在牛的正後方，一隻手抬起尾巴，另一隻手抓住尾巴根部","只應從尾根部彎曲，否則尾巴可能會斷裂","將牛尾根部彎曲向前，可操作牛隻向後方前進","正確操作時，會夾住脊椎和尾部神經，這樣能防止牛隻踢人並避免其對操作做攻擊反應"],"a":"C"},{"id":956,"q":"有關牛的尾根操作保定技術，下列何者錯誤？","o":["操作尾根保定可以是一種極好的保定方法","牛的尾巴很敏感，舉高彎曲牛會後肢無力、緩慢倒下","操作尾根保定一個人就可以進行","操作尾根保定無需特需器具就可以進行"],"a":"B"},{"id":957,"q":"有關外用抗寄生蟲藥的描述，何者為真？","o":["大多數局部應用適用於肩胛骨周圍的頸部底部","每月使用一次","藥通常用於治療和預防跳蚤、蜱蟲、蝨子和叮咬蒼蠅","以上皆是"],"a":"D"},{"id":958,"q":"有關皮下注射何者錯誤？","o":["在馬，皮下注射可在頸部外側、肋骨上方或肩膀前進行","如果在豬的腹部做皮下注射，應將針頭插入皮膚的摺皺處，而不是進入腹腔。","在較大的豬隻做皮下注射，首選的注射部位是耳後的松散皮膚","在較大的豬隻做皮下注射，如果使用足夠短的針頭，則不需要像小型動物那樣將皮膚拉起來形成帳篷"],"a":"A"},{"id":959,"q":"有關皮下注射何者錯誤？","o":["在體重大於 25 公斤的豬隻中，皮下注射主要在腹部的鬆散皮膚或肘部後方進行","在牛，皮下注射可在頸部外側、肋骨上方或肩膀前進行","在綿羊，皮下注射可在頸部外側、肋骨上方或肩膀前進行","在山羊，皮下注射可在頸部外側、肋骨上方或肩膀前進行"],"a":"A"},{"id":960,"q":"有關皮下注射何者錯誤？","o":["馬進行皮下注射前需用酒精綿清潔","馬使用 14 或 16 號、1 英寸針頭","消毒後可拉皮下注射","注射前須抽吸確保無血液"],"a":"B"},{"id":961,"q":"有關皮下注射何者錯誤？","o":["當治療的效果不會受到影響時，應選擇皮下注射而非肌肉注射，這樣可以減少肌肉組織的損傷並降低膿腫的發生率","在馬匹中進行皮下注射，這些藥物通常是小劑量的","羊是愛乾淨的動物，進行皮下注射時，皮膚不需消毒","對於馬來說，頸部的外側是適合的皮下注射部位"],"a":"C"},{"id":962,"q":"有關皮下注射何者錯誤？","o":["對羊隻的皮下注射而言，每個部位的藥物劑量應限制在 5 毫升","如果羊需要皮下注射較大劑量的藥物，應將劑量分成幾個部分，並在不同部位分次注射","如果羊需要皮下注射較大劑量的藥物且操作正確，應該在皮膚下留下小包塊","羊很怕痛，所以皮下注射時應一次將所有藥劑注射在單一位置"],"a":"D"},{"id":963,"q":"有關羊的保定技術，下列何者錯誤？","o":["羊性格固執，一旦抓住會不斷掙扎，需要縛具保定","羊群習慣聚集在一起，可以將其驅趕到角落，然後抓住目標動物","很難單獨挑選一隻羊並將其驅趕進角落進行抓捕","如果需要更多的頭部保定，可以使用縛具"],"a":"A"},{"id":964,"q":"有關羊的保定技術，下列何者錯誤？","o":["羊性格溫順，一旦抓住後便容易進行保定","羊群習慣聚集在一起，可以將其驅趕到角落，然後抓住目標動物","當羊的頭部向上傾斜時，它們會停下來","當羊往前奔跑，緊拉住尾巴，會讓他吃痛而靜止下來"],"a":"D"},{"id":965,"q":"有關羊的保定技術，下列何者錯誤？","o":["很難單獨挑選一隻羊並將其驅超進角落進行抓捕","將頭部向上傾斜，並將動物推向牆壁進行保定","要保定羊時，可面對奔來的羊隻，並側身展臂緊勾著羊頸靜止羊隻","剪修蹄部時，可以將羊坐起來，重心稍微後傾"],"a":"C"},{"id":966,"q":"有關肉牛的靜脈注射何者有誤？","o":["肉牛應被放入圍欄中，並為其頭部戴上籠頭，以進行頸靜脈注射","對於肉牛進行尾部注射，應在其後腿後放置一根橫桿，以防止被踢到","在有醫療需求時，一般而言，肉牛大都以肌肉注射為主","皮下腹部靜脈在肉牛中很常使用"],"a":"D"},{"id":967,"q":"有關肌肉注射何者錯誤？","o":["乳牛可以在保定架或頸夾中接受肌肉注射，通常不需要使用籠頭","小牛活潑好動，一定要使用縛具才能進行肌肉注射","羊和山羊可以被推到角落並用手臂將它們的頭部固定，再進行肌肉注射","對於成豬進行肌肉注射時，需要使用豬套鼻索"],"a":"B"},{"id":968,"q":"有關肌肉注射何者錯誤？","o":["馬在肌肉注射時，應該使用帶注射器的針頭插入肌肉，進行注射","對於成馬，應使用 16 號或 18 號、1.5 英寸的針頭進行肌肉注射","對於小型馬匹和幼駒，應使用 20 號、1 英寸的針頭進行肌肉注射","注射部位應用酒精棉擦拭清潔、消毒"],"a":"A"},{"id":969,"q":"有關肌肉注射何者錯誤？","o":["馬最安全的肌肉注射部位是頸部外側","注射部位為項韌帶、脊柱和肩胛骨形成的三角區域","馬神經質，應快速注射所有藥劑於單一部位","注射前應正確保定以保護人員"],"a":"C"},{"id":970,"q":"有關於貓免疫缺陷病毒(Feline immunodeficiency virus，簡稱：FIV)俗稱貓愛滋的傳染途徑何者錯誤？","o":["會傳染給人","貓與貓之間透過唾液和體液，進入血液傳染","垂直傳染","可能透過輸血傳染"],"a":"A"},{"id":971,"q":"有關狗貓眼睛白內障的形容哪一項正確？","o":["是一種不可逆的蛋白質變性","白內障形成的原因可能為遺傳性、先天性、後天性、老年性或是糖尿病等等","會阻擋視力並會引起眼內發炎感染、眼壓上升等","以上皆是"],"a":"D"},{"id":972,"q":"有關祛痰藥 Expectorants 的描述何者為真？","o":["許多祛痰藥也含有去充血劑(Decongestants)","可以增加呼吸道內的充血","可以增加黏膜內的充血","可以稠化痰"],"a":"A"},{"id":973,"q":"有關酏劑 Elixirs 的描述，何者為真？","o":["可靜脈注射","用於不溶於水的藥劑","能用水稀釋","為局部外用的酒精溶劑"],"a":"B"},{"id":974,"q":"有關馬的眼藥部份何者有誤？","o":["馬的角膜潰瘍需要使用阿托品來抑制睫狀肌痙攣，但馬仍能不畏強光是物種特性","馬的嚴重角膜潰瘍和其他一些異常可能需要額外的眼部保護，如黑色塑膠眼罩","在嚴重角膜潰瘍可能需要每 1 到 2 小時就進行一次局部治療","長時間躺臥的馬隻可能會在眼睛中積聚木屑或床墊。眼罩或防蠅面罩也可以幫助防止木屑進入眼睛"],"a":"A"},{"id":975,"q":"有關動物保定，下列何者錯誤？","o":["在保定動物時，應避免使用過度的力量","任何保定方法，都需考慮動物福利，不以帶給動物痛苦為樂","為了醫療的品質，所有的醫療程序都應該將動物進行保定","保定是為了確保動物、操作人員和獸醫專業人員的安全"],"a":"C"},{"id":976,"q":"有關動物保定，下列何者錯誤？","o":["為了得到良好的保定效果，應該能出多少力量就儘量使出以保安全","保定是獸醫學中的一個關鍵組成部分","可在採集動物檢驗樣本時進行","保障醫療人員安全"],"a":"A"},{"id":977,"q":"有關動物保定，下列何者錯誤？","o":["馬匹很習慣進行縛具保定","不要用力且單獨地抓住小鳥的翅膀，其翅膀是脆弱的，容易骨折","在許多經濟動物管理上執行日常程序，都需要將動物保定好再進行","綿羊喜歡被剃毛，不需保定也會乖乖配合"],"a":"D"},{"id":978,"q":"有關動物保定，下列何者錯誤？","o":["幫發情牛隻進行人工授精時，應將牛隻趕進頸夾內","可直接幫移動中的雞隻注射疫苗，不需一一捉著保定好再注射，以減少時間","幫豬群進行疫苗注射時，可以用圍欄將其行動範圍縮小再進行","要讓雞保持在一個位置並保持相對靜止，可以將它的翅膀交叉"],"a":"B"},{"id":979,"q":"有關國際公認的五大自由，下列選項何者正確？1 動物免於飢餓、口渴和營養不良的自由、2 動物免於恐懼和痛苦的自由、3 選擇具有正確 飼養觀念飼主的自由、4 選擇具有相關財力飼主的自由","o":["1、2","1、3","1、4","2、4"],"a":"A"},{"id":980,"q":"有關國際公認的實驗動物 3R，請選出最正確的選項：1 減少使用實驗動物數量、2 改進實驗方法、3 用非動物技術取代動物、4 回收動物屍 體、廢材再利用","o":["1、2、3、4","1、3、4","2、3、4","1、2、3"],"a":"D"},{"id":981,"q":"有關球槌槍(balling gun 火球丸器)，下列何者正確？","o":["使用時，將動物以頸部固定，在穩定將球丸放入動物口中","將球槌槍放入動物口時，可以直接將球丸推至整入動物口裡","球槌槍多用於小牛、羊羔和山羊，牠牛一樣","將球槌槍或工具調整抬高下頷的嘴上方，越過舌頭的中心確保在口中的深度足夠"],"a":"D"},{"id":982,"q":"有關蛋白質流失性腸病的敘述何者正確？","o":["此病貓較犬常見","臨床症狀與血檢可能發現腹水、下痢與高凝血狀態","其致病機制與大腸皺壁的解剖生理有關","超音波是診斷此病的黃金準則，沒有掃到腸道淋巴管擴張便能排除此病。"],"a":"B"},{"id":983,"q":"有關氯胺酮(ketamine)，下列描述何者為真？","o":["是一種短效注射麻醉劑","是一種長效注射麻醉劑","是一種吸入型氣體射麻醉劑","是一種注射鎮靜劑"],"a":"A"},{"id":984,"q":"有關給藥途徑的吸收效率，由快至慢何者排列正確？","o":["IV→IM→SC→PO","IV→IM→PO→SC","PO→IV→SC→IM","SC→IM→IV→SC"],"a":"A"},{"id":985,"q":"有關資訊系統之安全管理上哪些可避免資料外流？","o":["防火牆","密碼管理","虛擬私有網路","以上皆是"],"a":"D"},{"id":986,"q":"有關豬隻保定，下列何者正確？","o":["小公豬要去勢時，需要保定","成豬要採血時，可鼻套索保定","豬的腿細，且相對脆弱，長時間抓住和保定會對其造成傷害","以上皆是"],"a":"D"},{"id":987,"q":"有關豬隻保定，下列何者錯誤？","o":["小豬要剪乳齒時，不需要保定","小豬要剪尾時，不需要保定","小公豬要去勢時，不需要保定","小豬要剪耳時，不需要保定"],"a":"C"},{"id":988,"q":"有關靜脈注射何者錯誤？","o":["在進行靜脈注射時，血液會稀釋藥物，從而使藥物變得不那麼腐蝕性","頸靜脈是馬隻進行靜脈注射(IV)唯一適合的靜脈","頸靜脈位於頸動脈的深層，與頸動脈在同一區域","頸靜脈從頭部沿著頸部的頸溝向尾側延伸，然後進入胸腔入口，朝向心臟"],"a":"C"},{"id":989,"q":"有關靜脈注射何者錯誤？","o":["綿羊最常用於靜脈注射的靜脈是頸靜脈","山羊最常用於靜脈注射的靜脈是頸靜脈","牛最常用於靜脈注射的靜脈是頸靜脈","豬最常用於靜脈注射的靜脈是頸靜脈"],"a":"D"},{"id":990,"q":"有關靜脈注射的事前準備何者錯誤？","o":["應使用浸泡在 70%酒精棉花塊清潔注射部位","靜脈注射不應該在髒污或沾著糞便的皮膚上進行","在環境衛生的畜舍，可以用酒精噴在預定注射的部位來進行消毒即可","如果無法清楚地看到注射部位，可能需要將該部位的毛髮剪除"],"a":"C"},{"id":991,"q":"有關藥物的有效期限應該如何因應？","o":["應該隨意使用過期藥物","不需要檢查有效期限","應該在使用前檢查有效期限","可以將過期藥物重新標籤"],"a":"C"},{"id":992,"q":"有關藥物儲存溫度，下列何者為「冷藏」儲存溫度？","o":["<8 攝氏度","8-15 攝氏度","16-30 攝氏度","31-40 攝氏度"],"a":"A"},{"id":993,"q":"有關藥物儲存溫度，下列何者為「室溫」儲存溫度？","o":["<8 攝氏度","8-15 攝氏度","16-30 攝氏度","31-40 攝氏度"],"a":"C"},{"id":994,"q":"有關藥球植(balling gun)，下列何者正確？","o":["是設計來將大量膏劑，便於以口服方式對動物給藥","投與藥丸後，需觀察動物，確保藥物已經吞下","是設計來將大量粉劑，便於以口服方式對動物給藥","在將藥球和藥球植插入動物口中之前，不用先進行潤滑"],"a":"B"},{"id":995,"q":"有關藥球槍(balling gun)(投丸器)，下列何者錯誤？","o":["使用時，站在動物肩膀的前方，面對與動物相同的方向，將手臂跨過動物的鼻樑，並將動物的頭部靠在你的臀部來操作","用手指插人動物的口中，放置在門齒間除處，並施加壓力於硬顎，這會使動物張開嘴巴，便於放人藥丸槍","藥球槍前端以金屬製頭部比塑膠製頭部對咽部組織的損傷較小，且不易被牙齒損壞","在將藥球和藤球槍插人動物口中之前，應先進行潤滑"],"a":"C"},{"id":997,"q":"有關藥球槍(balling gun)(投丸器)，下列何者正確？","o":["是設計來將大的藥片(丸)或膠囊，便於以口服方式對動物給藥","是設計來將大量膏劑，便於以口服方式對動物給藥","是設計來將液態藥劑，便於以口服方式對動物給藥","是設計來將抗生素錠劑，便於以口服方式對動物給藥治療"],"a":"A"},{"id":998,"q":"有關藥球槍(balling gun)(投丸器)，下列何者正確？","o":["商業製備的膏劑注射器含有藥物，其使用方式與藥丸槍相同。膏劑通常會放置在舌頭上，而不是直接進入食道","可將抗生素錠劑以口服方式對動物給藥治療","使用藥丸槍時，可以直接將藥丸槍硬塞入動物口裡","對家禽的口服給藥可以使用藥球槍(balling gun)"],"a":"A"},{"id":999,"q":"有關藥球槍(balling gun)(投丸器)，下列何者正確？","o":["藥球槍前端以金屬製頭部比塑膠製頭部對咽部組織的損傷較小，且不易被牙齒損壞。","藥球槍前端以塑料頭部比金屬頭部對咽部組織的損傷較小，但容易被牙齒損壞。","藥球槍沒有分尺寸小牛、羊羔和山羊、成牛都一樣","使用藥球槍餵藥很方便，連液態藥劑也可以餵"],"a":"B"},{"id":1000,"q":"有關藥糊的描述，何者為真？","o":["屬於液態劑型","又稱乳膏","又稱乳膏","屬於半固態劑型"],"a":"D"}];let exam=[],answers=[],idx=0,wrongOnly=false;const $=id=>document.getElementById(id);$('bank').textContent=`題庫可用 ${BANK.length} 題（已排除標記刪除或解析不完整題目）`;function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function start(){exam=shuffle([...BANK]).slice(0,100);answers=Array(100).fill(null);idx=0;$('intro').classList.add('hide');$('result').classList.add('hide');$('exam').classList.remove('hide');render();scrollTo(0,0)}function resetExam(){if(exam.length&&!confirm('確定重新抽取100題？目前作答結果將清除。'))return;start()}function render(){let q=exam[idx];$('counter').textContent=`第 ${idx+1} / 100 題`;$('answered').textContent=`已作答 ${answers.filter(x=>x!==null).length} / 100`;$('fill').style.width=((idx+1)/100)+'%';$('source').textContent=`原始題庫第 ${q.id} 題`;$('question').textContent=q.q;$('choices').innerHTML='';q.o.forEach((t,i)=>{let b=document.createElement('button');b.className='choice'+(answers[idx]===i?' sel':'');b.innerHTML=`<span class="letter">${'ABCD'[i]}</span><span></span>`;b.lastChild.textContent=t;b.onclick=()=>{answers[idx]=i;render()};$('choices').appendChild(b)});$('numbers').innerHTML='';for(let i=0;i<100;i++){let b=document.createElement('button');b.textContent=i+1;b.className='num'+(answers[i]!==null?' done':'')+(idx===i?' current':'');b.onclick=()=>{idx=i;render()};$('numbers').appendChild(b)}}function move(d){idx=Math.max(0,Math.min(99,idx+d));render()}function submitExam(){let blank=answers.filter(a=>a===null).length;if(blank&&!confirm(`還有 ${blank} 題未作答，確定交卷？未作答計為錯題。`))return;let right=exam.reduce((n,q,i)=>n+(answers[i]=== 'ABCD'.indexOf(q.a)),0);$('exam').classList.add('hide');$('result').classList.remove('hide');$('score').textContent=right;$('correct').textContent=right;$('incorrect').textContent=100-right;$('pct').textContent=right+'%';$('accuracy').style.width=right+'%';$('ring').setAttribute('stroke-dasharray',`${(right/100)*295.31} 295.31`);wrongOnly=false;$('wrongBtn').textContent='只看錯題';showReview();scrollTo(0,0)}function toggleWrong(){wrongOnly=!wrongOnly;$('wrongBtn').textContent=wrongOnly?'顯示全部題目':'只看錯題';showReview()}function showReview(){let out=$('reviews');out.innerHTML='';exam.forEach((q,i)=>{let selected=answers[i],correct='ABCD'.indexOf(q.a),ok=selected===correct;if(wrongOnly&&ok)return;let el=document.createElement('div');el.className='review';let h=document.createElement('div');h.innerHTML=`<strong>第 ${i+1} 題</strong> <span class="tag">原始題號 ${q.id}</span> <strong class="${ok?'good':'bad'}">${ok?'✓ 正確':'✕ 錯誤'}</strong>`;el.appendChild(h);let p=document.createElement('p');p.textContent=q.q;el.appendChild(p);let f=document.createElement('div');f.className='flow';f.innerHTML=`<span class="node ${ok?'right':'wrong'}">你的答案：${selected===null?'未作答':'ABCD'[selected]}</span><span>→</span><span class="node right">標準答案：${q.a}</span>`;el.appendChild(f);q.o.forEach((opt,j)=>{let line=document.createElement('div');line.style.padding='3px 0';line.style.color=j===correct?'#117655':'#637486';line.textContent=`${'ABCD'[j]}. ${opt}${j===correct?' ✓ 題庫答案':''}`;el.appendChild(line)});out.appendChild(el)})}</script></body></html>
